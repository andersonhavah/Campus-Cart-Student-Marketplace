name: Deploy Campus Cart to Azure App Service

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET Environment Core SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore Project Dependencies
        run: dotnet restore

      - name: Compile and Release Asset Bundles
        run: dotnet publish -c Release -o ./publish

      - name: Deploy Compiled DLL to Azure WebApp Port
        uses: azure/webapps-deploy@v3
        with:
          app-name: "campus-cart-marketplace"
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
